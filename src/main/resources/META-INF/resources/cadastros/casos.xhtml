<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/layout.xhtml">

    <ui:define name="titulo">Manter casos</ui:define>

    <ui:define name="conteudo">
        <h:form id="form">
            <div class="painel">
                <div class="painel-titulo">Manter casos — base de casos</div>
                <div class="painel-corpo">
                    <div class="barra-acoes">
                        <p:commandButton value="Novo caso" icon="pi pi-plus" action="#{casoBean.novo}"
                                         process="@this" update="conteudoDlg" resetValues="true"
                                         oncomplete="PF('dlg').show()"/>
                        <p:outputLabel for="filtroModulo" value="Módulo:" style="margin-left:16px"/>
                        <p:selectOneMenu id="filtroModulo" value="#{casoBean.filtroModuloId}" style="width:220px">
                            <f:selectItem itemLabel="Todos" itemValue="#{null}"/>
                            <f:selectItems value="#{casoBean.modulos}" var="m" itemLabel="#{m.descricao}" itemValue="#{m.id}"/>
                            <p:ajax listener="#{casoBean.filtrar}" update="lista"/>
                        </p:selectOneMenu>
                    </div>

                    <p:dataTable id="lista" value="#{casoBean.casos}" var="c" rowKey="#{c.id}" paginator="true" rows="10"
                                 paginatorPosition="bottom" emptyMessage="Nenhum caso cadastrado.">
                        <p:column style="width:2rem"><p:rowToggler/></p:column>
                        <p:column headerText="Caso" style="width:4rem">nº #{c.id}</p:column>
                        <p:column headerText="Módulo" style="width:9rem">#{c.modulo.descricao}</p:column>
                        <p:column headerText="Inclusão" style="width:8rem">
                            <h:outputText value="#{c.dataInclusao}">
                                <f:convertDateTime pattern="dd/MM/yyyy" timeZone="America/Sao_Paulo"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Solução">#{c.solucao}</p:column>
                        <p:column headerText="Situação" style="width:7rem">
                            <p:tag value="#{c.valido ? 'Validado' : 'Pendente'}" severity="#{c.valido ? 'success' : 'warning'}"/>
                        </p:column>
                        <p:column style="width:7rem">
                            <p:commandButton icon="pi pi-pencil" title="Editar" action="#{casoBean.editar(c)}"
                                             process="@this" update=":form:conteudoDlg" resetValues="true"
                                             oncomplete="PF('dlg').show()" styleClass="ui-button-secondary"/>
                            <p:commandButton icon="pi pi-trash" title="Excluir" action="#{casoBean.excluir(c)}"
                                             process="@this" update=":form:lista" styleClass="ui-button-danger">
                                <p:confirm header="Excluir" message="Excluir o caso nº #{c.id}?" icon="pi pi-exclamation-triangle"/>
                            </p:commandButton>
                        </p:column>
                        <p:rowExpansion>
                            <h:dataTable value="#{c.detalhes}" var="d" cellpadding="3">
                                <h:column><strong>#{d.campoDoModulo.campo.descricao}:</strong></h:column>
                                <h:column>#{empty d.valor ? '—' : d.valor}</h:column>
                            </h:dataTable>
                            <p class="ajuda" rendered="#{not empty c.casoOrigem}">
                                Recuperado do caso nº #{c.casoOrigem.id} (#{c.percentualOrigem}%). #{c.adaptacao}
                            </p>
                        </p:rowExpansion>
                    </p:dataTable>
                </div>
            </div>

            <p:dialog header="Caso" widgetVar="dlg" modal="true" resizable="false" width="720" responsive="true">
                <p:outputPanel id="conteudoDlg">
                    <h:panelGrid columns="2" styleClass="grid-form">
                        <p:outputLabel for="modulo" value="Módulo:"/>
                        <p:selectOneMenu id="modulo" value="#{casoBean.moduloId}" style="width:240px"
                                         disabled="#{not empty casoBean.casoId}">
                            <f:selectItem itemLabel="Selecione o módulo" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{casoBean.modulos}" var="m" itemLabel="#{m.descricao}" itemValue="#{m.id}"/>
                            <p:ajax listener="#{casoBean.selecionarModulo}" process="@this" update="conteudoDlg"/>
                        </p:selectOneMenu>
                    </h:panelGrid>

                    <p:dataTable value="#{casoBean.campos}" var="cm" rendered="#{not empty casoBean.campos}"
                                 styleClass="tabela-descricao" style="margin-top:8px">
                        <f:facet name="header">Descrição do problema</f:facet>
                        <p:column headerText="Campo" style="width:35%">#{cm.campo.descricao}</p:column>
                        <p:column headerText="Valor">
                            <p:inputText value="#{casoBean.valores[cm.id]}" maxlength="500" styleClass="largura-total"
                                         placeholder="#{cm.campo.tipoCampo.descricao}"/>
                        </p:column>
                    </p:dataTable>

                    <h:panelGrid columns="1" styleClass="grid-form largura-total" style="margin-top:8px">
                        <p:outputLabel for="solucao" value="Solução do problema:"/>
                        <p:inputTextarea id="solucao" value="#{casoBean.solucao}" rows="5" maxlength="1000"
                                         styleClass="largura-total" autoResize="false"/>
                        <p:selectBooleanCheckbox value="#{casoBean.valido}" itemLabel="Caso validado"/>
                    </h:panelGrid>

                    <div class="botoes-centro">
                        <p:commandButton value="Salvar" icon="pi pi-save" action="#{casoBean.salvar}"
                                         process="conteudoDlg" update="conteudoDlg lista"
                                         oncomplete="if (!args.validationFailed) PF('dlg').hide()"/>
                        <p:commandButton value="Cancelar" type="button" onclick="PF('dlg').hide()"
                                         styleClass="ui-button-secondary"/>
                    </div>
                </p:outputPanel>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>

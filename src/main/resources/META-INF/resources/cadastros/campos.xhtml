<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/layout.xhtml">

    <ui:define name="titulo">Campos</ui:define>

    <ui:define name="conteudo">
        <h:form id="form">
            <div class="painel">
                <div class="painel-titulo">Campos de descrição de problemas</div>
                <div class="painel-corpo">
                    <p class="ajuda">
                        O tipo do campo define a medida de similaridade local: <strong>Texto</strong> usa a contagem de
                        palavras (com o dicionário de dados) e <strong>Numérico</strong> usa a similaridade escalar.
                    </p>
                    <div class="barra-acoes">
                        <p:commandButton value="Novo campo" icon="pi pi-plus" action="#{campoBean.novo}"
                                         process="@this" update="conteudoDlg" resetValues="true"
                                         oncomplete="PF('dlg').show()"/>
                    </div>
                    <p:dataTable id="lista" value="#{campoBean.campos}" var="c" emptyMessage="Nenhum campo cadastrado.">
                        <p:column headerText="Código" style="width:6rem">#{c.id}</p:column>
                        <p:column headerText="Descrição">#{c.descricao}</p:column>
                        <p:column headerText="Tipo" style="width:9rem">#{c.tipoCampo.descricao}</p:column>
                        <p:column style="width:7rem">
                            <p:commandButton icon="pi pi-pencil" title="Editar" action="#{campoBean.editar(c)}"
                                             process="@this" update=":form:conteudoDlg" resetValues="true"
                                             oncomplete="PF('dlg').show()" styleClass="ui-button-secondary"/>
                            <p:commandButton icon="pi pi-trash" title="Excluir" action="#{campoBean.excluir(c)}"
                                             process="@this" update=":form:lista" styleClass="ui-button-danger">
                                <p:confirm header="Excluir" message="Excluir o campo #{c.descricao}?" icon="pi pi-exclamation-triangle"/>
                            </p:commandButton>
                        </p:column>
                    </p:dataTable>
                </div>
            </div>

            <p:dialog header="Campo" widgetVar="dlg" modal="true" resizable="false" width="440">
                <p:outputPanel id="conteudoDlg">
                    <h:panelGrid columns="2" styleClass="grid-form">
                        <p:outputLabel for="descricao" value="Descrição:"/>
                        <p:inputText id="descricao" value="#{campoBean.campo.descricao}" maxlength="100" size="30"/>
                        <p:outputLabel for="tipo" value="Tipo:"/>
                        <p:selectOneMenu id="tipo" value="#{campoBean.campo.tipoCampo}">
                            <f:selectItems value="#{campoBean.tipos}" var="t" itemLabel="#{t.descricao}" itemValue="#{t}"/>
                        </p:selectOneMenu>
                    </h:panelGrid>
                    <div class="botoes-centro">
                        <p:commandButton value="Salvar" icon="pi pi-save" action="#{campoBean.salvar}"
                                         process="conteudoDlg" update="conteudoDlg lista"
                                         oncomplete="if (!args.validationFailed) PF('dlg').hide()"/>
                        <p:commandButton value="Cancelar" action="#{campoBean.carregar}" process="@this"
                                         update="lista" oncomplete="PF('dlg').hide()" styleClass="ui-button-secondary"/>
                    </div>
                </p:outputPanel>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>

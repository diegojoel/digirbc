<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <f:facet name="first">
        <meta charset="UTF-8"/>
    </f:facet>
    <title>DigiRBC - Acesso</title>
    <h:outputStylesheet library="primefaces" name="primeicons/primeicons.css"/>
    <link rel="stylesheet" type="text/css" href="#{request.contextPath}/javax.faces.resource/digirbc.css.xhtml?ln=css&amp;v=4"/>
</h:head>
<h:body>
    <div class="login">
        <form class="login-caixa" method="post" action="#{request.contextPath}/login">
            <div class="logo">
                <i class="pi pi-sun"></i><span class="logo-digi">DIGI</span><span class="logo-rbc">RBC</span>
            </div>
            <ui:fragment rendered="#{not empty param.erro}">
                <div class="login-alerta">Login ou senha inválidos.</div>
            </ui:fragment>
            <ui:fragment rendered="#{not empty param.saiu}">
                <div class="login-alerta login-aviso">Sessão encerrada.</div>
            </ui:fragment>
            <label for="username">Login</label>
            <input type="text" id="username" name="username" autofocus="autofocus" required="required"/>
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required="required"/>
            <button type="submit">Entrar</button>
        </form>
    </div>
</h:body>
</html>
